# Production Environment Configuration

environment: prod
debug: false

# API
api_host: "0.0.0.0"
api_port: 8000
api_debug: false

# Logging
log_level: INFO
log_format: json

# Performance
enable_cache: true
cache_ttl: 7200
rate_limit_per_minute: 60

# Security
# API keys should be loaded from AWS Secrets Manager in production
