[project]
name = "hybrid-rag-research"
version = "0.1.0"
description = "Hybrid Search RAG system for academic research papers"
authors = [
    {name = "Hybrid RAG Team"}
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",

    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Logging and Observability
    "loguru>=0.7.2",
    "opik>=0.3.0",
    "comet-ml>=3.47.0",

    # Document Processing
    "docling>=2.9.0",
    "chonkie>=0.3.0",

    # Embeddings and ML
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",

    # Vector and Search Databases
    "qdrant-client>=1.12.0",
    "elasticsearch>=8.15.0",

    # LLMs and Reranking
    "cohere>=5.11.0",
    "anthropic>=0.39.0",
    "openai>=1.54.0",

    # AWS Services
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # Caching
    "redis>=5.2.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",

    # Code Quality
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",

    # Load Testing
    "locust>=2.32.0",

    # Jupyter
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
