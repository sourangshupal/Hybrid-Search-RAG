apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: hybrid-rag
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  selector:
    app: redis
    component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  sessionAffinity: None

---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: hybrid-rag
  labels:
    app: redis
    component: cache
spec:
  clusterIP: None
  selector:
    app: redis
    component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
