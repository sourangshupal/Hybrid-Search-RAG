apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: hybrid-rag
  labels:
    app: hybrid-rag-api
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP  # Internal service, exposed via Ingress
  selector:
    app: hybrid-rag-api
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  sessionAffinity: None

---
# Headless service for StatefulSet pod discovery
apiVersion: v1
kind: Service
metadata:
  name: api-headless
  namespace: hybrid-rag
  labels:
    app: hybrid-rag-api
    component: api
spec:
  clusterIP: None
  selector:
    app: hybrid-rag-api
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
