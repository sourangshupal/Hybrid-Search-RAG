apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: hybrid-rag
  labels:
    app: elasticsearch
    component: search-engine
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
    component: search-engine
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
  sessionAffinity: None

---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: hybrid-rag
  labels:
    app: elasticsearch
    component: search-engine
spec:
  clusterIP: None
  selector:
    app: elasticsearch
    component: search-engine
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
