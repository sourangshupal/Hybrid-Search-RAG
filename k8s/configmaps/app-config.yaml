apiVersion: v1
kind: ConfigMap
metadata:
  name: hybrid-rag-config
  namespace: hybrid-rag
  labels:
    app: hybrid-rag-api
    component: config
data:
  # Application settings
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  VERSION: "1.0.0"

  # Service endpoints (internal cluster DNS)
  QDRANT_HOST: "qdrant-service.hybrid-rag.svc.cluster.local"
  QDRANT_PORT: "6333"
  ELASTICSEARCH_HOST: "elasticsearch-service.hybrid-rag.svc.cluster.local"
  ELASTICSEARCH_PORT: "9200"
  REDIS_HOST: "redis-service.hybrid-rag.svc.cluster.local"
  REDIS_PORT: "6379"

  # AWS settings
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "hybrid-rag-documents-prod"

  # Performance settings
  ENABLE_TRACING: "true"
  ENABLE_COMET_TRACKING: "false"

  # Uvicorn settings
  UVICORN_WORKERS: "4"
  UVICORN_HOST: "0.0.0.0"
  UVICORN_PORT: "8000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-config
  namespace: hybrid-rag
  labels:
    app: qdrant
    component: config
data:
  # Qdrant configuration
  QDRANT__SERVICE__GRPC_PORT: "6334"
  QDRANT__SERVICE__HTTP_PORT: "6333"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: hybrid-rag
  labels:
    app: elasticsearch
    component: config
data:
  # Elasticsearch settings
  discovery.type: "single-node"
  xpack.security.enabled: "false"
  ES_JAVA_OPTS: "-Xms2g -Xmx2g"
  bootstrap.memory_lock: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: hybrid-rag
  labels:
    app: redis
    component: config
data:
  redis.conf: |
    # Redis configuration for hybrid-rag
    maxmemory 2gb
    maxmemory-policy allkeys-lru

    # Persistence
    save 900 1
    save 300 10
    save 60 10000

    # Replication
    repl-diskless-sync yes
    repl-diskless-sync-delay 5

    # Security
    protected-mode yes

    # Performance
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
